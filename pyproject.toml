[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secgen" 
version = "1.0.0"
authors = [
  { name="Cristopher Méndez Cervantes", email="cristophermendezcervantes@gmail.com" },
]
description = "A brief tool to analyse and generate entropic passwords and keys."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/cristopherpydev/secgen" 

[tool.setuptools.package-data]
secgen = ["data/*.json"]